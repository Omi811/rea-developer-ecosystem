version: "3.8"

services:
  lighthouse-engine:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: lighthouse-auditor-service
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=production
      - CHROME_PATH=/usr/bin/chromium
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
