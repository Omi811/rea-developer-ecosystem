version: "3.8"

services:
  reui-registry:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: reui-registry-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ../public/r:/app/public/r:ro
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/r/index.json"]
      interval: 30s
      timeout: 5s
      retries: 3
